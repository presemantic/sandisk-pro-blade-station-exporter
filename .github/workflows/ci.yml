name: Build and publish exporter
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: exporter-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Format, vet and race tests
        run: |
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
          go test -race -count=1 ./...
      - name: Fuzz decoder boundaries
        run: go test ./internal/protocol -run='^$' -fuzz=FuzzDecode -fuzztime=10s -parallel=2
      - name: Cross-compile Linux binaries
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -o "/tmp/exporter-$arch" ./cmd/sandisk-pro-blade-station-exporter
          done
  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Authenticate to existing Artifact Registry
        id: gcp-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.GCP_SA_ARTIFACT_REGISTRY_KEY }}
          token_format: access_token
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: europe-west1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcp-auth.outputs.access_token }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: image
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: europe-west1-docker.pkg.dev/prod-common-cicd/presemantic-docker/sandisk-pro-blade-station-exporter:${{ github.sha }}
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Publish image reference
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf 'Image: `europe-west1-docker.pkg.dev/prod-common-cicd/presemantic-docker/sandisk-pro-blade-station-exporter:%s`\n\nDigest: `%s`\n' "$GITHUB_SHA" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
